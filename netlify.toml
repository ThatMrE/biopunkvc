# Netlify config — biopunk.vc / biopunkvc.com
# Static site (no build step). The Early-Stage Biotech Capital Map.

[build]
  publish = "."
  command = ""

# --- Redirect www -> apex ---
[[redirects]]
  from = "https://www.biopunkvc.com/*"
  to = "https://biopunkvc.com/:splat"
  status = 301
  force = true

# --- Long-cache fingerprint-free static assets are fine to revalidate;
#     but the DATA and HTML must stay fresh so the map is "continuously updating". ---

# Fonts/images etc. (none bundled today, but safe default for /assets images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"

# The dataset must never be stale — it changes as sources are added.
[[headers]]
  for = "/assets/data.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML should revalidate frequently.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers site-wide.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[context.production]
  environment = { CONTEXT = "production" }
